services:
  postgres:
    image: postgres:16
    container_name: kmcontrol-db
    environment:
      POSTGRES_DB: motoboy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: kmcontrol-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/motoboy_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: sua_chave_secreta_aqui_minimo_32_caracteres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: